<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroCode Studio</title>

<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="Stylesheet" href="Styles.css">
    
</head>

<body>

<div id="loader"><img src="logo.png"></div>
<canvas id="stars"></canvas>

<header>
<div class="logo">AstroCode | Studio </div>
<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<nav id="nav">
<a href="index.html">Inicio</a>
<a href="Nosotros.html">Nosotros</a>
<a href="Servicios.html">Servicios</a>
<a href="Paquete.html">Paquetes </a>
<a href="Portafolio.html">Portafolio</a>
<a href="Testimonios.html">Testimonios</a>
<a href="Contacto.html">Contacto</a>
</nav>
</header>


<!-- 🚀 CONTACTO -->
<section class="show">

<h2 style="text-align:center;">Hablemos de tu proyecto</h2>

<p class="subtext" style="text-align:center; margin:auto;">
Cuéntanos tu idea y creemos juntos una experiencia digital moderna,
impactante y profesional.
</p>

<!-- CARD CONTACTO -->
<div class="card"
style="
max-width:700px;
margin:50px auto 0 auto;
padding:40px;
position:relative;
overflow:hidden;
">

<!-- GLOW -->
<div style="
position:absolute;
width:250px;
height:250px;
background:#00d4ff;
filter:blur(120px);
opacity:.12;
top:-80px;
right:-80px;
z-index:0;
"></div>

<form
class="contact-form"
action="https://formspree.io/f/xblaqzoy"
method="POST"
style="position:relative; z-index:2;"
>

<input
type="text"
name="name"
placeholder="Tu nombre"
required
>

<input
type="email"
name="email"
placeholder="Tu correo electrónico"
required
>

<input
type="text"
name="business"
placeholder="Nombre de tu negocio (opcional)"
>

<textarea
name="message"
placeholder="Cuéntanos sobre tu proyecto..."
rows="7"
required
></textarea>

<button
class="btn"
type="submit"
style="
width:100%;
margin-top:15px;
font-weight:600;
font-size:1rem;
"
>
Enviar mensaje 🚀
</button>

</form>

</div>

</section>

<!-- FOOTER -->
<footer>
© 2026 AstroCode Studio — Todos los derechos reservados
</footer>

<script>

/* MENU MOBILE */
function toggleMenu(){
document.getElementById("nav").classList.toggle("active");
}

/* 🌌 ESTRELLAS */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for(let i=0;i<120;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
s:Math.random()*2
});

}

function animateStars(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(star=>{

ctx.fillRect(star.x,star.y,star.s,star.s);

star.y += 0.2;

if(star.y > canvas.height){
star.y = 0;
}

});

requestAnimationFrame(animateStars);

}

animateStars();

/* RESPONSIVE */
window.addEventListener('resize',()=>{

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

});

</script>

</body>
</html>
