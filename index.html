<script>

/* ===== LOADER + HERO FIX ===== */
window.addEventListener("load",()=>{

  const loader = document.getElementById("loader");
  const hero = document.querySelector(".hero");

  setTimeout(()=>{
    loader.style.opacity = "0";
    loader.style.transition = "opacity 1s ease";
  },3000);

  setTimeout(()=>{
    loader.style.display = "none";

    // 🔥 ACTIVA HERO (ANTES NO PASABA)
    hero.style.opacity = "1";
    hero.style.transform = "translateY(0)";
  },4000);

});


/* ===== MENU ===== */
function toggleMenu(){
  document.getElementById("nav").classList.toggle("active");
}


/* ===== ESTRELLAS OPTIMIZADAS ===== */
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
window.addEventListener("resize",resize);
resize();

let stars=[];
for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    s:Math.random()*1.5,
    sp:Math.random()*0.3+0.05
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="white";

  stars.forEach(star=>{
    star.y += star.sp;

    if(star.y>canvas.height){
      star.y=0;
      star.x=Math.random()*canvas.width;
    }

    ctx.fillRect(star.x,star.y,star.s,star.s);
  });

  requestAnimationFrame(draw);
}
draw();


/* ===== TEXTO DINÁMICO ===== */
const phrases=[
  "Experiencias que inspiran",
  "Soluciones que venden",
  "Tecnología que conecta"
];

let i=0;
setInterval(()=>{
  document.getElementById("dynamic-text").textContent=phrases[i];
  i=(i+1)%phrases.length;
},2200);


/* ===== SCROLL PRO (MEJOR QUE EL ANTERIOR) ===== */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("show");
    }
  });
},{threshold:0.15});

document.querySelectorAll("section:not(.hero)").forEach(sec=>{
  observer.observe(sec);
});


/* ===== BIENVENIDA + CHISPAS ===== */
function goToWelcome(e){

  for(let i=0;i<25;i++){
    let p=document.createElement("div");
    p.className="particle";

    p.style.left=e.clientX+"px";
    p.style.top=e.clientY+"px";

    p.style.setProperty('--x',(Math.random()*250-125)+"px");
    p.style.setProperty('--y',(Math.random()*250-125)+"px");

    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }

  const bienvenida = document.getElementById("bienvenida");

  bienvenida.scrollIntoView({behavior:"smooth"});

  setTimeout(()=>{
    bienvenida.classList.add("show");
  },400);
}

</script>
