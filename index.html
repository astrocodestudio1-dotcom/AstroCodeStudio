<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroCode Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* VARIABLES */
:root {
  --gradient: linear-gradient(90deg, #00d4ff, #5b8cff, #8a2be2);
}

/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Inter', sans-serif;
  background:#0b0f1a;
  color:#fff;
  overflow-x:hidden;
}

/* ========================= */
/* 🚀 LOADER SPACE X */
/* ========================= */

#spacex-loader {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: radial-gradient(circle, #02040a, #000);
  z-index: 9999;
  overflow: hidden;
}

.stars-layer {
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(white 1px, transparent 1px);
  background-size: 3px 3px;
  animation: starsMove 60s linear infinite;
  opacity: 0.3;
}

@keyframes starsMove {
  to { transform: translateY(-1000px); }
}

.logo-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.logo-container img {
  width: 240px;
  opacity: 0;
  transform: scale(0.6);
  animation: logoCinematic 4s ease forwards;
}

@keyframes logoCinematic {
  0% {
    opacity: 0;
    transform: scale(0.5) translateY(40px);
    filter: blur(12px);
  }
  30% {
    opacity: 1;
    transform: scale(1.05);
    filter: blur(0);
  }
  60% {
    transform: scale(1);
    filter: drop-shadow(0 0 30px #00d4ff);
  }
  80% {
    filter: drop-shadow(0 0 60px #5b8cff);
  }
  100% {
    transform: scale(1);
  }
}

.flash {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(0,212,255,0.4), transparent 70%);
  opacity: 0;
  animation: flashEffect 1s ease;
  animation-delay: 3.2s;
}

@keyframes flashEffect {
  50% { opacity: 0.6; }
}

#spacex-loader.fade-out {
  animation: fadeOutLoader 1.2s ease forwards;
}

@keyframes fadeOutLoader {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

/* ========================= */
/* 🌌 FONDO NORMAL */
/* ========================= */

.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.stars::before {
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(white 1px, transparent 1px);
  background-size:3px 3px;
  animation:move 120s linear infinite;
  opacity:0.3;
}

@keyframes move {
  to { transform:translateY(-1200px); }
}

/* NAVBAR */
header {
  display:flex;
  justify-content:space-between;
  padding:20px 50px;
  position:fixed;
  width:100%;
  z-index:1000;
  transition:0.3s;
}

header.scrolled {
  background:rgba(10,15,30,0.85);
  backdrop-filter:blur(10px);
}

nav a {
  color:#ccc;
  margin-left:25px;
  text-decoration:none;
}

nav a:hover { color:#fff; }

/* HERO */
.hero {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero img {
  width:280px;
  margin-bottom:20px;
}

.hero h1 {
  font-family:'Orbitron';
  font-size:3rem;
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* BOTÓN */
.btn {
  margin-top:20px;
  padding:12px 30px;
  border-radius:40px;
  background:var(--gradient);
  color:#000;
  border:none;
  cursor:pointer;
}

/* SECCIONES */
section {
  padding:100px 20px;
  max-width:1100px;
  margin:auto;
}

h2 {
  text-align:center;
  margin-bottom:40px;
  font-family:'Orbitron';
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

/* CARDS */
.card {
  background:#12172b;
  padding:30px;
  border-radius:20px;
  text-align:center;
}

.card i {
  font-size:30px;
  margin-bottom:10px;
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TESTIMONIOS */
.testimonial {
  background:#12172b;
  padding:25px;
  border-radius:20px;
}

/* FORM */
form {
  display:flex;
  flex-direction:column;
  gap:15px;
  max-width:500px;
  margin:auto;
}

input, textarea {
  padding:12px;
  border-radius:10px;
  border:none;
  background:#1a1f3c;
  color:#fff;
}

/* FOOTER */
footer {
  text-align:center;
  padding:30px;
  color:#777;
}

</style>
</head>

<body>

<!-- 🚀 LOADER -->
<div id="spacex-loader">
  <div class="stars-layer"></div>
  <div class="logo-container">
    <img src="logo-completo.png">
  </div>
  <div class="flash"></div>
</div>

<div class="stars"></div>

<header id="navbar">
  <div>AstroCode</div>
  <nav>
    <a href="#">Inicio</a>
    <a href="#servicios">Servicios</a>
    <a href="#portafolio">Portafolio</a>
    <a href="#testimonios">Testimonios</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<section class="hero">
  <img src="logo-completo.png">
  <h1>Desarrollamos ideas digitales</h1>
  <button class="btn">Contáctanos</button>
</section>

<section id="servicios">
  <h2>Servicios</h2>
  <div class="grid">
    <div class="card"><i class="fas fa-code"></i><h3>Web</h3></div>
    <div class="card"><i class="fas fa-laptop"></i><h3>UI/UX</h3></div>
    <div class="card"><i class="fas fa-database"></i><h3>Backend</h3></div>
  </div>
</section>

<section id="portafolio">
  <h2>Portafolio</h2>
  <div class="grid">
    <img src="https://via.placeholder.com/400">
    <img src="https://via.placeholder.com/400">
  </div>
</section>

<section id="testimonios">
  <h2>Testimonios</h2>
  <div class="grid">
    <div class="testimonial"><p>Excelente trabajo.</p></div>
    <div class="testimonial"><p>Muy profesionales.</p></div>
  </div>
</section>

<section id="contacto">
  <h2>Contacto</h2>
  <form>
    <input type="text" placeholder="Nombre">
    <input type="email" placeholder="Correo">
    <textarea placeholder="Mensaje"></textarea>
    <button class="btn">Enviar</button>
  </form>
</section>

<footer>
© 2026 AstroCode Studio
</footer>

<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("spacex-loader").classList.add("fade-out");
  }, 4200);
});
</script>

</body>
</html>
