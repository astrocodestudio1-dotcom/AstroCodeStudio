<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroCode Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Inter', sans-serif;
  background:#0b0f1a;
  color:#fff;
  overflow-x:hidden;
}

/* ================= LOADER ================= */

#spacex-loader {
  position: fixed;
  width:100%;
  height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  perspective:1200px;
}

.logo-3d img {
  width:260px;
  opacity:0;
  transform: translateZ(-800px) scale(0.4);
  animation: intro 4.5s forwards;
}

@keyframes intro {
  0% { opacity:0; transform:translateZ(-1000px) scale(0.3); filter:blur(20px); }
  40% { opacity:1; transform:translateZ(100px) scale(1.1); filter:blur(0); }
  100% { transform:scale(1); filter:drop-shadow(0 0 40px #00d4ff); }
}

#spacex-loader.fade-out {
  animation: fadeOut 1s forwards;
}
@keyframes fadeOut { to { opacity:0; visibility:hidden; } }

/* NAV */
header {
  position:fixed;
  width:100%;
  padding:20px 50px;
  display:flex;
  justify-content:space-between;
  z-index:1000;
}

nav a {
  margin-left:20px;
  color:#ccc;
  text-decoration:none;
}

/* HERO */
.hero {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero img { width:260px; }

.hero h1 {
  font-family:'Orbitron';
  font-size:3rem;
}

/* TEXTO IA */
#dynamic-text {
  margin-top:10px;
  color:#00d4ff;
}

/* BOTON */
.btn {
  margin-top:20px;
  padding:14px 35px;
  border-radius:40px;
  background:linear-gradient(90deg,#00d4ff,#5b8cff,#8a2be2);
  border:none;
  cursor:pointer;
}

/* BIENVENIDA */
.welcome {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background: radial-gradient(circle,#111,#000);
  transform:translateY(100px);
  opacity:0;
  transition:1s;
}

.welcome.show {
  transform:translateY(0);
  opacity:1;
}

/* PARTICULAS */
.particle {
  position:fixed;
  width:6px;
  height:6px;
  background:#00d4ff;
  border-radius:50%;
  pointer-events:none;
  animation: particleMove 1s forwards;
}

@keyframes particleMove {
  to {
    transform:translate(var(--x), var(--y));
    opacity:0;
  }
}

/* PARALLAX */
.parallax {
  transition: transform 0.2s;
}

</style>
</head>

<body>

<!-- LOADER -->
<div id="spacex-loader">
  <div class="logo-3d">
    <img src="logo.png">
  </div>
</div>

<header>
  <div>AstroCode</div>
  <nav>
    <a href="#">Inicio</a>
    <a href="#bienvenida">Bienvenida</a>
  </nav>
</header>

<section class="hero parallax">
  <img src="logo.png">
  <h1>Desarrollamos ideas digitales</h1>
  <p id="dynamic-text"></p>
  <button class="btn" onclick="goToWelcome(event)">Bienvenidos</button>
</section>

<section id="bienvenida" class="welcome">
  <h2>Bienvenido a AstroCode</h2>
  <p>Impulsamos negocios con tecnología moderna.</p>
</section>

<script>

/* LOADER */
window.addEventListener("load", ()=>{
  setTimeout(()=>{
    document.getElementById("spacex-loader").classList.add("fade-out");
  },4500);
});

/* TEXTO IA */
const phrases = [
  "Creamos experiencias digitales",
  "Impulsamos tu negocio",
  "Tecnología que transforma",
  "Diseño que conecta"
];

let i = 0;
setInterval(()=>{
  document.getElementById("dynamic-text").textContent = phrases[i];
  i = (i + 1) % phrases.length;
},2000);

/* PARTICULAS CLICK */
function goToWelcome(e){

  for(let i=0;i<20;i++){
    let p = document.createElement("div");
    p.className = "particle";

    p.style.left = e.clientX + "px";
    p.style.top = e.clientY + "px";

    p.style.setProperty('--x',(Math.random()*200-100)+"px");
    p.style.setProperty('--y',(Math.random()*200-100)+"px");

    document.body.appendChild(p);

    setTimeout(()=>p.remove(),1000);
  }

  document.getElementById("bienvenida").scrollIntoView({behavior:"smooth"});

  setTimeout(()=>{
    document.querySelector(".welcome").classList.add("show");
  },500);
}

/* PARALLAX */
document.addEventListener("mousemove", e=>{
  let x = (e.clientX / window.innerWidth - 0.5) * 20;
  let y = (e.clientY / window.innerHeight - 0.5) * 20;

  document.querySelectorAll(".parallax").forEach(el=>{
    el.style.transform = `translate(${x}px, ${y}px)`;
  });
});

</script>

</body>
</html>
